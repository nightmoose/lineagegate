# Single Fly machine: FalkorDB + LineageGate API/UI in one image (see Dockerfile).
# FalkorDB listens on 127.0.0.1 only; the graph is re-seeded on boot if empty.
app = "lineagegate"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  LINEAGEGATE_GRAPH = "acme"
  LLM_MODEL = "grok-4.20-0309-non-reasoning"  # ~2x faster than grok-4.3 for the demo

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
